<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Folio — Book Library{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink: #0f0e0c;
      --paper: #f5f0e8;
      --cream: #ede8dc;
      --rust: #c4531a;
      --gold: #b8903a;
      --muted: #7a756c;
      --border: #d4cfc4;
      --white: #faf8f4;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--paper);
      color: var(--ink);
      min-height: 100vh;
    }

    /* NAV */
    nav {
      background: var(--ink);
      padding: 0 2.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .nav-logo {
      font-family: 'Playfair Display', serif;
      font-size: 1.5rem;
      color: var(--paper);
      text-decoration: none;
      letter-spacing: 0.03em;
    }
    .nav-logo span { color: var(--rust); font-style: italic; }
    .nav-add {
      background: var(--rust);
      color: white;
      text-decoration: none;
      padding: 0.45rem 1.1rem;
      font-size: 0.85rem;
      font-weight: 500;
      letter-spacing: 0.04em;
      transition: background 0.2s;
    }
    .nav-add:hover { background: #a84316; }

    /* MESSAGES */
    .messages { padding: 0.75rem 2.5rem; }
    .message {
      padding: 0.75rem 1rem;
      border-left: 3px solid var(--rust);
      background: var(--cream);
      font-size: 0.9rem;
      margin-bottom: 0.5rem;
    }

    /* MAIN */
    main { max-width: 1100px; margin: 0 auto; padding: 2.5rem 2rem; }

    /* BUTTONS */
    .btn {
      display: inline-block;
      padding: 0.55rem 1.25rem;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.85rem;
      font-weight: 500;
      text-decoration: none;
      cursor: pointer;
      border: none;
      letter-spacing: 0.03em;
      transition: all 0.18s;
    }
    .btn-primary { background: var(--ink); color: var(--paper); }
    .btn-primary:hover { background: #2a2820; }
    .btn-secondary { background: transparent; color: var(--ink); border: 1.5px solid var(--border); }
    .btn-secondary:hover { border-color: var(--ink); }
    .btn-danger { background: #c0392b; color: white; }
    .btn-danger:hover { background: #a93226; }
    .btn-edit { background: var(--gold); color: white; }
    .btn-edit:hover { background: #9e7a2e; }

    /* FORMS */
    .form-card {
      background: var(--white);
      border: 1px solid var(--border);
      padding: 2.5rem;
      max-width: 680px;
    }
    .form-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.8rem;
      margin-bottom: 2rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }
    .form-group { margin-bottom: 1.4rem; }
    .form-group label {
      display: block;
      font-size: 0.78rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.4rem;
    }
    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 0.65rem 0.9rem;
      background: var(--paper);
      border: 1.5px solid var(--border);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      color: var(--ink);
      outline: none;
      transition: border-color 0.2s;
    }
    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus { border-color: var(--ink); }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .form-actions { display: flex; gap: 0.75rem; margin-top: 1.75rem; }
    .errorlist { list-style: none; color: #c0392b; font-size: 0.82rem; margin-top: 0.3rem; }

    footer {
      text-align: center;
      padding: 2rem;
      color: var(--muted);
      font-size: 0.8rem;
      border-top: 1px solid var(--border);
      margin-top: 4rem;
    }
  </style>
  {% block extra_css %}{% endblock %}
</head>
<body>

<nav>
  <a href="/" class="nav-logo">Fo<span>lio</span></a>
  <a href="{% url 'book_create' %}" class="nav-add">+ Add Book</a>
</nav>

{% if messages %}
<div class="messages">
  {% for message in messages %}
    <div class="message">{{ message }}</div>
  {% endfor %}
</div>
{% endif %}

<main>
  {% block content %}{% endblock %}
</main>

<footer>Folio Book Library &mdash; Django CRUD Demo</footer>

</body>
</html>
