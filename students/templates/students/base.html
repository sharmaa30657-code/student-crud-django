<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}StudentHub{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --surface2: #1c2128;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #7d8590;
      --blue: #388bfd;
      --blue-dim: #1f3a6e;
      --green: #3fb950;
      --green-dim: #1a3a26;
      --amber: #d29922;
      --amber-dim: #3d2f0e;
      --red: #f85149;
      --red-dim: #3a1a1a;
      --purple: #8b5cf6;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* NAV */
    nav {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 2rem;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .nav-brand {
      font-family: 'Syne', sans-serif;
      font-size: 1.3rem;
      color: var(--text);
      text-decoration: none;
    }
    .nav-brand span { color: var(--blue); }
    .nav-links { display: flex; gap: 0.5rem; align-items: center; }
    .nav-link {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.85rem;
      padding: 0.4rem 0.75rem;
      border-radius: 6px;
      transition: all 0.15s;
    }
    .nav-link:hover { color: var(--text); background: var(--surface2); }
    .nav-btn {
      background: var(--blue);
      color: white;
      text-decoration: none;
      padding: 0.45rem 1rem;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      transition: opacity 0.15s;
    }
    .nav-btn:hover { opacity: 0.85; }

    /* MESSAGES */
    .messages { padding: 0.75rem 2rem; }
    .message {
      padding: 0.7rem 1rem;
      border-radius: 6px;
      font-size: 0.88rem;
      margin-bottom: 0.4rem;
      background: var(--green-dim);
      border: 1px solid var(--green);
      color: var(--green);
    }

    /* MAIN */
    main { max-width: 1100px; margin: 0 auto; padding: 2rem; }

    /* BUTTONS */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.83rem;
      font-weight: 600;
      text-decoration: none;
      border: none;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-primary { background: var(--blue); color: white; }
    .btn-primary:hover { opacity: 0.85; }
    .btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
    .btn-ghost:hover { color: var(--text); border-color: var(--muted); }
    .btn-danger { background: var(--red-dim); color: var(--red); border: 1px solid var(--red); }
    .btn-danger:hover { background: var(--red); color: white; }
    .btn-edit { background: var(--amber-dim); color: var(--amber); border: 1px solid var(--amber); }
    .btn-edit:hover { background: var(--amber); color: #0d1117; }
    .btn-sm { padding: 0.3rem 0.65rem; font-size: 0.78rem; }

    /* BADGES */
    .badge {
      display: inline-block;
      padding: 0.2rem 0.6rem;
      border-radius: 20px;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.03em;
    }
    .badge-active { background: var(--green-dim); color: var(--green); }
    .badge-inactive { background: var(--surface2); color: var(--muted); }
    .badge-graduated { background: var(--blue-dim); color: var(--blue); }

    /* FORMS */
    .form-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2rem;
      max-width: 700px;
    }
    .form-title {
      font-family: 'Syne', sans-serif;
      font-size: 1.5rem;
      margin-bottom: 1.75rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }
    .form-group { margin-bottom: 1.25rem; }
    .form-group label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 0.4rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 0.65rem 0.85rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.92rem;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s;
    }
    .form-group input:focus,
    .form-group select:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(56,139,253,0.12); }
    .form-group select option { background: var(--surface); }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .form-actions { display: flex; gap: 0.75rem; margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px solid var(--border); }
    .errorlist { list-style: none; color: var(--red); font-size: 0.8rem; margin-top: 0.3rem; }

    footer {
      text-align: center;
      padding: 2rem;
      color: var(--muted);
      font-size: 0.78rem;
      border-top: 1px solid var(--border);
      margin-top: 4rem;
    }
  </style>
  {% block extra_css %}{% endblock %}
</head>
<body>

<nav>
  <a href="/students/" class="nav-brand">Student<span>Hub</span></a>
  <div class="nav-links">
    <a href="/students/" class="nav-link">Students</a>
    <a href="/students/new/" class="nav-btn">+ Add Student</a>
  </div>
</nav>

{% if messages %}
<div class="messages">
  {% for message in messages %}
    <div class="message">✓ {{ message }}</div>
  {% endfor %}
</div>
{% endif %}

<main>
  {% block content %}{% endblock %}
</main>

<footer>StudentHub &mdash; Django CRUD</footer>

</body>
</html>
